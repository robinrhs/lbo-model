[project]
name = "lbo-model"
version = "0.1.0"
description = "A transparent leveraged buyout (LBO) model in Python: sources & uses, debt schedule with cash sweep, IRR/MOIC, value creation bridge and Excel export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robin-Philip Rehschuh" }]
requires-python = ">=3.11"
keywords = ["finance", "private-equity", "lbo", "valuation", "financial-modeling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
lbo = "lbo.cli:main"

[dependency-groups]
dev = [
    "numpy-financial>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
